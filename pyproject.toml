[project]
name = "emailmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "alembic>=1.18.4",
    "beautifulsoup4>=4.14.3",
    "bitsandbytes>=0.49.2",
    "cython>=3.2.4",
    "fastapi>=0.135.2",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "google-genai>=1.73.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.11.0",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.48",
    "streamlit>=1.56.0",
    "torch>=2.5.1",
    "transformers>=5.6.2",
    "uvicorn>=0.42.0",
]
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'windows' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'windows' or sys_platform == 'win32'" },
]
